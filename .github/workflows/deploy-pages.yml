name: Deploy JoJo Brain to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and upload Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate static app
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage repository Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html 404.html offline.html styles.css config.js graph-data.js pointer-gesture.js runnix-adapter.js neural-engine.js app.js manifest.webmanifest service-worker.js .nojekyll _site/
          cp -R assets _site/assets
          test -f _site/index.html
          test -f _site/404.html
          test -f _site/.nojekyll

      - name: Upload GitHub Pages artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: _site
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
