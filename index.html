<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#05070d">
  <meta name="description" content="JoJo Brain — jouw levende persoonlijke universum voor Sport & Health, Home en Development.">
  <meta name="application-name" content="JoJo Brain">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JoJo">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <title>JoJo · Living Neural Universe</title>
</head>
<body>
  <a class="skip-link" href="#universe">Ga naar het universum</a>
  <main class="universe" id="universe" aria-label="JoJo Living Neural Universe">
    <canvas id="space-canvas" aria-hidden="true"></canvas>
    <div class="nebula nebula-a" aria-hidden="true"></div>
    <div class="nebula nebula-b" aria-hidden="true"></div>

    <header class="topbar">
      <button class="brand" type="button" data-action="root" aria-label="Terug naar JoJo">
        <span class="brand-orbit" aria-hidden="true"><span>J</span></span>
        <span class="brand-copy"><strong>JOJO</strong><small>LIVING NEURAL UNIVERSE</small></span>
      </button>
      <nav class="pathbar" aria-label="Huidig pad">
        <button class="round-button" type="button" data-action="back" aria-label="Terug" title="Terug">←</button>
        <ol id="breadcrumbs"></ol>
      </nav>
      <div class="system-actions">
        <span class="fps-mode" id="motion-mode">LIVE</span>
        <span class="connection" id="connection-status" role="status"><i></i><span>ONLINE</span></span>
        <button class="install-button" id="install-button" type="button" hidden>↓ Installeer</button>
        <span class="version">V0.3.0</span>
      </div>
    </header>

    <section class="graph-viewport" id="graph-viewport" aria-label="Interactieve neurale kaart">
      <div class="cluster-title" id="cluster-title" aria-live="polite">
        <small>JOJO UNIVERSE</small>
        <strong>Alles verbonden.</strong>
      </div>
      <div class="node-layer" id="node-layer"></div>
      <div class="gesture-help" id="gesture-help"><span>↔</span> Sleep nodes · tik om te focussen</div>
      <div class="depth-indicator" aria-hidden="true"><i></i><i></i><i></i></div>
    </section>

    <aside class="info-drawer is-collapsed" id="info-drawer" aria-labelledby="detail-title">
      <button class="drawer-handle" type="button" data-action="toggle-drawer" aria-label="Infopaneel in- of uitklappen"><span></span></button>
      <div class="drawer-heading">
        <div>
          <span class="domain-chip" id="detail-domain">ROOT</span>
          <span class="status-chip" id="detail-status">LIVE</span>
        </div>
        <button class="drawer-close" type="button" data-action="close-drawer" aria-label="Infopaneel sluiten">×</button>
      </div>
      <p class="detail-eyebrow" id="detail-eyebrow">PERSONAL CONTROL CENTER</p>
      <h1 id="detail-title">JoJo</h1>
      <p class="detail-description" id="detail-description"></p>
      <div class="detail-flow" id="detail-flow"></div>
      <ul class="detail-points" id="detail-points"></ul>
      <div class="detail-actions" id="detail-actions"></div>
      <p class="privacy-note" id="privacy-note"></p>
    </aside>

    <nav class="mobile-dock" aria-label="Snelle navigatie">
      <button type="button" data-action="back"><span>←</span><small>Terug</small></button>
      <button type="button" data-node="sport-health"><span>◉</span><small>Sport</small></button>
      <button class="dock-jojo" type="button" data-action="root"><span>J</span><small>JoJo</small></button>
      <button type="button" data-node="home"><span>⌂</span><small>Home</small></button>
      <button type="button" data-node="development"><span>⌘</span><small>Dev</small></button>
    </nav>

    <div class="boot-screen" id="boot-screen" aria-hidden="true">
      <div class="boot-orbit"><span>J</span></div>
      <p>NEURAL UNIVERSE INITIALISEREN</p>
    </div>
  </main>
  <noscript><p class="noscript">JoJo heeft JavaScript nodig voor de interactieve neurale kaart.</p></noscript>
  <script src="config.js"></script>
  <script src="graph-data.js"></script>
  <script src="neural-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
