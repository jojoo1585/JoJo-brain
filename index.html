<!doctype html>
<html lang="nl" class="is-booting">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#05070d">
  <meta name="description" content="JoJo Brain — jouw levende persoonlijke universum voor Sport & Health, Home en Development.">
  <meta name="application-name" content="JoJo Brain">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JoJo">
  <script>
    /* Runs before CSS: Samsung installed PWAs need the visual viewport, not 100vh. */
    (function () {
      var root = document.documentElement;
      function syncViewport() {
        var viewport = window.visualViewport;
        var height = viewport && viewport.height ? viewport.height : window.innerHeight;
        var width = viewport && viewport.width ? viewport.width : window.innerWidth;
        if (height > 0) root.style.setProperty('--app-height', Math.round(height) + 'px');
        if (width > 0) root.style.setProperty('--app-width', Math.round(width) + 'px');
      }
      window.__JOJO_SYNC_VIEWPORT__ = syncViewport;
      syncViewport();
      window.addEventListener('resize', syncViewport, { passive: true });
      window.addEventListener('orientationchange', function () { setTimeout(syncViewport, 80); }, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncViewport, { passive: true });
        window.visualViewport.addEventListener('scroll', syncViewport, { passive: true });
      }
      /* A failed or mixed-cache bootstrap may never leave static fallback chrome visible. */
      window.__JOJO_BOOT_GUARD__ = setTimeout(function () {
        var boot = document.getElementById('boot-screen');
        if (boot && !root.classList.contains('app-ready')) {
          var status = boot.querySelector('p');
          if (status) status.textContent = 'UPDATE TOEPASSEN…';
          if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistration().then(function (r) { if (r) r.update(); });
        }
      }, 3500);
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest?v=0.4.0.1">
  <link rel="icon" href="assets/icons/favicon.svg?v=0.4.0.1" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=0.4.0.1">
  <link rel="stylesheet" href="styles.css?v=0.4.0.1">
  <title>JoJo · Living Neural Universe</title>
</head>
<body>
  <a class="skip-link" href="#universe">Ga naar het universum</a>
  <main class="universe" id="universe" aria-label="JoJo Living Neural Universe">
    <canvas id="space-canvas" aria-hidden="true"></canvas>
    <div class="nebula nebula-a" aria-hidden="true"></div>
    <div class="nebula nebula-b" aria-hidden="true"></div>

    <header class="topbar">
      <button class="brand" type="button" data-action="root" aria-label="Terug naar JoJo">
        <span class="brand-orbit" aria-hidden="true"><span>J</span></span>
        <span class="brand-copy"><strong>JOJO</strong><small>LIVING NEURAL UNIVERSE</small></span>
      </button>
      <nav class="pathbar" aria-label="Huidig pad">
        <button class="round-button" type="button" data-action="back" aria-label="Terug" title="Terug">←</button>
        <ol id="breadcrumbs"></ol>
      </nav>
      <div class="system-actions">
        <span class="fps-mode" id="motion-mode">LIVE</span>
        <span class="connection" id="connection-status" role="status"><i></i><span>ONLINE</span></span>
        <button class="install-button" id="install-button" type="button" hidden>↓ Installeer</button>
        <span class="version">V0.4.0.1</span>
      </div>
    </header>

    <section class="graph-viewport" id="graph-viewport" aria-label="Interactieve neurale kaart">
      <div class="cluster-title" id="cluster-title" aria-live="polite"><small>JOJO UNIVERSE</small><strong>Alles verbonden.</strong></div>
      <div class="signal-legend" aria-label="Betekenis van de Sport & Health datalijnen">
        <span class="legend-blue"><i></i>Source</span>
        <span class="legend-green"><i></i>Context</span>
        <span class="legend-magenta"><i></i>Intelligence</span>
        <span class="legend-orange"><i></i>Cross-check</span>
      </div>
      <div class="node-layer" id="node-layer"></div>
      <div class="gesture-help" id="gesture-help"><span>↔</span> Sleep nodes · tik om te focussen</div>
      <div class="depth-indicator" aria-hidden="true"><i></i><i></i><i></i></div>
    </section>

    <aside class="info-drawer is-collapsed" id="info-drawer" aria-labelledby="detail-title">
      <button class="drawer-handle" type="button" data-action="toggle-drawer" aria-label="Infopaneel in- of uitklappen"><span></span></button>
      <div class="drawer-heading"><div><span class="domain-chip" id="detail-domain"></span><span class="status-chip" id="detail-status"></span></div><button class="drawer-close" type="button" data-action="close-drawer" aria-label="Infopaneel sluiten">×</button></div>
      <p class="detail-eyebrow" id="detail-eyebrow"></p>
      <h1 id="detail-title"></h1>
      <p class="detail-description" id="detail-description"></p>
      <div class="detail-flow" id="detail-flow"></div>
      <ul class="detail-points" id="detail-points"></ul>
      <div class="detail-actions" id="detail-actions"></div>
      <p class="privacy-note" id="privacy-note"></p>
    </aside>

    <nav class="mobile-dock" aria-label="Snelle navigatie">
      <button type="button" data-action="back"><span>←</span><small>Terug</small></button>
      <button type="button" data-node="sport-health"><span>◉</span><small>Sport</small></button>
      <button class="dock-jojo" type="button" data-action="root"><span>J</span><small>JoJo</small></button>
      <button type="button" data-node="home"><span>⌂</span><small>Home</small></button>
      <button type="button" data-node="development"><span>⌘</span><small>Dev</small></button>
    </nav>

    <div class="boot-screen" id="boot-screen" aria-hidden="true">
      <div class="boot-orbit"><span>J</span></div>
      <p>NEURAL UNIVERSE INITIALISEREN</p>
    </div>
  </main>
  <noscript><p class="noscript">JoJo heeft JavaScript nodig voor de interactieve neurale kaart.</p></noscript>
  <script defer src="config.js?v=0.4.0.1"></script>
  <script defer src="graph-data.js?v=0.4.0.1"></script>
  <script defer src="neural-engine.js?v=0.4.0.1"></script>
  <script defer src="app.js?v=0.4.0.1"></script>
</body>
</html>
